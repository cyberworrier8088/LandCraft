<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LandCraft - Pixel Studio</title>
  <style>
    :root {
      --bg: #14161a;
      --panel: #1e2229;
      --panel-border: #2e3541;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--panel-border);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.5px;
    }
    .brand img {
      width: 24px;
      height: 24px;
      image-rendering: pixelated;
    }
    .mode-select, .action-buttons {
      display: flex;
      gap: 8px;
    }
    button {
      background: #2b313d;
      color: var(--text);
      border: 1px solid var(--panel-border);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.15s;
    }
    button:hover { background: #374151; }
    button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .main-workspace {
      display: flex;
      flex: 1;
      height: calc(100vh - 54px);
    }
    .sidebar {
      width: 260px;
      background: var(--panel);
      border-right: 1px solid var(--panel-border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }
    .sidebar h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .tool-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }
    .palette-color {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      border: 2px solid transparent;
      cursor: pointer;
    }
    .palette-color.selected {
      border-color: #fff;
      transform: scale(1.08);
    }
    .color-picker-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    input[type="color"] {
      border: none;
      width: 36px;
      height: 36px;
      background: transparent;
      cursor: pointer;
      border-radius: 4px;
    }
    .canvas-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1115;
      background-image: 
        linear-gradient(45deg, #181b22 25%, transparent 25%), 
        linear-gradient(-45deg, #181b22 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #181b22 75%), 
        linear-gradient(-45deg, transparent 75%, #181b22 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      position: relative;
    }
    #drawCanvas {
      image-rendering: pixelated;
      cursor: crosshair;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 1px solid #3b82f644;
    }
    .preview-panel {
      width: 280px;
      background: var(--panel);
      border-left: 1px solid var(--panel-border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }
    #preview3d {
      width: 200px;
      height: 200px;
      background: #11141a;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
    }
    .info-box {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
      width: 100%;
      background: #13171e;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #232934;
    }
    .info-box span { color: var(--text); font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="../../assets/ui/grass-block.png" alt="Icon" />
      <span>LandCraft Pixel Studio</span>
    </div>
    <div class="mode-select">
      <button id="modeBlock" class="active" onclick="setMode('block')">16x16 Block</button>
      <button id="modePlayer" onclick="setMode('player')">64x64 Player Skin</button>
    </div>
    <div class="action-buttons">
      <button onclick="undo()">Undo</button>
      <button onclick="clearCanvas()">Clear</button>
      <button onclick="exportPNG()" style="background: var(--accent); border-color: var(--accent);">Export PNG</button>
    </div>
  </header>

  <div class="main-workspace">
    <div class="sidebar">
      <div>
        <h3>Tools</h3>
        <div class="tool-grid">
          <button id="toolPencil" class="active" onclick="setTool('pencil')">Pencil</button>
          <button id="toolEraser" onclick="setTool('eraser')">Eraser</button>
          <button id="toolFill" onclick="setTool('fill')">Bucket</button>
          <button id="toolPicker" onclick="setTool('picker')">Picker</button>
          <button id="toolShadeDown" onclick="setTool('darken')">Darken</button>
          <button id="toolShadeUp" onclick="setTool('lighten')">Lighten</button>
        </div>
      </div>

      <div>
        <h3>Active Color</h3>
        <div class="color-picker-row">
          <input type="color" id="primaryColor" value="#567d46" onchange="setColor(this.value)">
          <span id="hexLabel" style="font-family: monospace; font-size: 13px;">#567d46</span>
        </div>
      </div>

      <div>
        <h3>Voxel Palettes</h3>
        <div class="palette-grid" id="palette"></div>
      </div>
    </div>

    <div class="canvas-container">
      <canvas id="drawCanvas"></canvas>
    </div>

    <div class="preview-panel">
      <h3>3D Preview</h3>
      <canvas id="preview3d" width="200" height="200"></canvas>
      <div class="info-box">
        <div>Resolution: <span id="resLabel">16 x 16</span></div>
        <div>Format: <span>Direct Engine Atlas</span></div>
        <div style="margin-top: 8px;">Export saves directly to <code>assets/block/</code> for LandCraft.</div>
      </div>
    </div>
  </div>

  <script>
    let currentMode = 'block'; // 'block' (16x16) or 'player' (64x64)
    let resolution = 16;
    let canvasSize = 512;
    let pixelSize = canvasSize / resolution;
    let currentColor = '#567d46';
    let currentTool = 'pencil';
    let isDrawing = false;
    let pixels = [];
    let history = [];

    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    const previewCanvas = document.getElementById('preview3d');
    const pCtx = previewCanvas.getContext('2d');

    const defaultPalette = [
      '#4a7238', '#5b8a45', '#739d59', '#866043', '#573d26', '#3b2818',
      '#7b7b7b', '#919191', '#545454', '#3d3d3d', '#a37b51', '#c79f6f',
      '#483526', '#3a2b1f', '#2a1f16', '#2d68c4', '#4287f5', '#60a5fa',
      '#d97706', '#f59e0b', '#fbbf24', '#dc2626', '#ef4444', '#f87171'
    ];

    function init() {
      canvas.width = canvasSize;
      canvas.height = canvasSize;
      initPixels();
      buildPalette();
      render();
      render3D();
    }

    function initPixels() {
      pixels = [];
      for (let y = 0; y < resolution; y++) {
        let row = [];
        for (let x = 0; x < resolution; x++) {
          row.push(null);
        }
        pixels.push(row);
      }
    }

    function buildPalette() {
      const container = document.getElementById('palette');
      container.innerHTML = '';
      defaultPalette.forEach(c => {
        const div = document.createElement('div');
        div.className = 'palette-color' + (c === currentColor ? ' selected' : '');
        div.style.background = c;
        div.onclick = () => {
          setColor(c);
          document.getElementById('primaryColor').value = c;
          document.querySelectorAll('.palette-color').forEach(el => el.classList.remove('selected'));
          div.classList.add('selected');
        };
        container.appendChild(div);
      });
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('modeBlock').classList.toggle('active', mode === 'block');
      document.getElementById('modePlayer').classList.toggle('active', mode === 'player');
      resolution = mode === 'block' ? 16 : 64;
      pixelSize = canvasSize / resolution;
      document.getElementById('resLabel').innerText = `${resolution} x ${resolution}`;
      initPixels();
      history = [];
      render();
      render3D();
    }

    function setTool(tool) {
      currentTool = tool;
      const tools = ['pencil', 'eraser', 'fill', 'picker', 'darken', 'lighten'];
      tools.forEach(t => {
        const btn = document.getElementById('tool' + t.charAt(0).toUpperCase() + t.slice(1));
        if (btn) btn.classList.toggle('active', t === tool);
      });
    }

    function setColor(hex) {
      currentColor = hex;
      document.getElementById('hexLabel').innerText = hex;
    }

    function saveState() {
      if (history.length > 30) history.shift();
      history.push(JSON.stringify(pixels));
    }

    function undo() {
      if (history.length > 0) {
        pixels = JSON.parse(history.pop());
        render();
        render3D();
      }
    }

    function clearCanvas() {
      saveState();
      initPixels();
      render();
      render3D();
    }

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const x = Math.floor((e.clientX - rect.left) / pixelSize);
      const y = Math.floor((e.clientY - rect.top) / pixelSize);
      return { x: Math.max(0, Math.min(resolution - 1, x)), y: Math.max(0, Math.min(resolution - 1, y)) };
    }

    function adjustColor(hex, factor) {
      if (!hex) return hex;
      let r = parseInt(hex.slice(1, 3), 16);
      let g = parseInt(hex.slice(3, 5), 16);
      let b = parseInt(hex.slice(5, 7), 16);
      r = Math.min(255, Math.max(0, Math.round(r * factor)));
      g = Math.min(255, Math.max(0, Math.round(g * factor)));
      b = Math.min(255, Math.max(0, Math.round(b * factor)));
      return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
    }

    function applyTool(x, y) {
      if (currentTool === 'pencil') {
        pixels[y][x] = currentColor;
      } else if (currentTool === 'eraser') {
        pixels[y][x] = null;
      } else if (currentTool === 'picker') {
        if (pixels[y][x]) {
          setColor(pixels[y][x]);
          document.getElementById('primaryColor').value = pixels[y][x];
          setTool('pencil');
        }
      } else if (currentTool === 'darken') {
        if (pixels[y][x]) pixels[y][x] = adjustColor(pixels[y][x], 0.85);
      } else if (currentTool === 'lighten') {
        if (pixels[y][x]) pixels[y][x] = adjustColor(pixels[y][x], 1.15);
      } else if (currentTool === 'fill') {
        floodFill(x, y, pixels[y][x], currentColor);
      }
    }

    function floodFill(startX, startY, targetColor, fillColor) {
      if (targetColor === fillColor) return;
      const stack = [[startX, startY]];
      while (stack.length > 0) {
        const [x, y] = stack.pop();
        if (x < 0 || x >= resolution || y < 0 || y >= resolution) continue;
        if (pixels[y][x] === targetColor) {
          pixels[y][x] = fillColor;
          stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
        }
      }
    }

    canvas.addEventListener('mousedown', (e) => {
      saveState();
      isDrawing = true;
      const { x, y } = getCoords(e);
      applyTool(x, y);
      render();
      render3D();
    });

    window.addEventListener('mouseup', () => { isDrawing = false; });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing || currentTool === 'fill' || currentTool === 'picker') return;
      const { x, y } = getCoords(e);
      applyTool(x, y);
      render();
      render3D();
    });

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let y = 0; y < resolution; y++) {
        for (let x = 0; x < resolution; x++) {
          if (pixels[y][x]) {
            ctx.fillStyle = pixels[y][x];
            ctx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
          }
        }
      }

      // Draw subtle grid
      if (resolution <= 32) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = 1;
        for (let i = 0; i <= resolution; i++) {
          ctx.beginPath();
          ctx.moveTo(i * pixelSize, 0);
          ctx.lineTo(i * pixelSize, canvasSize);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, i * pixelSize);
          ctx.lineTo(canvasSize, i * pixelSize);
          ctx.stroke();
        }
      }
    }

    function render3D() {
      pCtx.clearRect(0, 0, 200, 200);
      const isoCanvas = document.createElement('canvas');
      isoCanvas.width = resolution;
      isoCanvas.height = resolution;
      const ictx = isoCanvas.getContext('2d');
      for (let y = 0; y < resolution; y++) {
        for (let x = 0; x < resolution; x++) {
          if (pixels[y][x]) {
            ictx.fillStyle = pixels[y][x];
            ictx.fillRect(x, y, 1, 1);
          }
        }
      }

      // Draw Isometric Cube Preview
      const cx = 100, cy = 100, size = 60;
      // Top face
      pCtx.save();
      pCtx.transform(1, 0.5, -1, 0.5, cx, cy - size * 0.7);
      pCtx.drawImage(isoCanvas, 0, 0, size * 0.7, size * 0.7);
      pCtx.restore();

      // Left face
      pCtx.save();
      pCtx.transform(1, 0.5, 0, 1, cx - size * 0.7, cy - size * 0.35);
      pCtx.drawImage(isoCanvas, 0, 0, size * 0.7, size * 0.7);
      pCtx.fillStyle = 'rgba(0,0,0,0.2)';
      pCtx.fillRect(0, 0, size * 0.7, size * 0.7);
      pCtx.restore();

      // Right face
      pCtx.save();
      pCtx.transform(1, -0.5, 0, 1, cx, cy);
      pCtx.drawImage(isoCanvas, 0, 0, size * 0.7, size * 0.7);
      pCtx.fillStyle = 'rgba(0,0,0,0.4)';
      pCtx.fillRect(0, 0, size * 0.7, size * 0.7);
      pCtx.restore();
    }

    function exportPNG() {
      const out = document.createElement('canvas');
      out.width = resolution;
      out.height = resolution;
      const octx = out.getContext('2d');
      for (let y = 0; y < resolution; y++) {
        for (let x = 0; x < resolution; x++) {
          if (pixels[y][x]) {
            octx.fillStyle = pixels[y][x];
            octx.fillRect(x, y, 1, 1);
          }
        }
      }
      const a = document.createElement('a');
      a.download = (currentMode === 'block' ? 'custom_block.png' : 'custom_skin.png');
      a.href = out.toDataURL('image/png');
      a.click();
    }

    init();
  </script>
</body>
</html>
